name: Close pull requests

# Code changes come from the maintainer alone (see CONTRIBUTING.md). A pull request from
# anyone else is thanked and closed, pointing to issues instead. pull_request_target runs
# with this repo's token but never checks out or runs the pull request's code.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.user.login != github.repository_owner && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const home = `https://github.com/${owner}/${repo}`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: [
                'Thank you for taking the time to work on this! 💚',
                '',
                `XenonShelf does not accept pull requests (see [CONTRIBUTING.md](${home}/blob/main/CONTRIBUTING.md)), so this one is closed automatically.`,
                `Please describe the problem or the idea in an [issue](${home}/issues/new/choose) instead: it is just as helpful, and it will be looked at.`,
              ].join('\n'),
            });
            await github.rest.pulls.update({ owner, repo, pull_number: number, state: 'closed' });
