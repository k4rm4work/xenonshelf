version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 10
    ignore:
      # Types for the Node the app runs on (Dockerfile, CI): moved by hand with it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
