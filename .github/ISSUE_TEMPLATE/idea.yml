name: Suggest an idea
description: Something XenonShelf could do, or do better.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! Before writing, see if someone has suggested it already and give
        it a 👍: the most wanted ideas come first. You can write in English or Polish.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: What you're trying to do with your collection, and what gets in the way today.
  - type: input
    id: version
    attributes:
      label: App version
      description: Filled in when you write from the app.
